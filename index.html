<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const key = 'ui-theme'
        let storedTheme = null
        try {
          storedTheme = window.localStorage.getItem(key)
        } catch {
          storedTheme = null
        }
        const hasStoredTheme = storedTheme === 'light' || storedTheme === 'dark'
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        const nextTheme = hasStoredTheme ? storedTheme : preferredTheme
        document.documentElement.dataset.theme = nextTheme
        document.documentElement.style.colorScheme = nextTheme
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/zen.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-typescript-boilerplate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
